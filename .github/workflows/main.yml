name: Auto Update Fantasy Dashboard

on:
  schedule:
    # 全日每 30 分鐘自動更新一次
    - cron: '*/30 * * * *'
  workflow_dispatch: # 隨時可以手動按鈕強制重新整理！

# 保留防撞機制：若上一次未跑完，自動取消舊任務，確保不會發生 Git 衝突
concurrency:
  group: update-data-group
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests espn_api

      - name: Run Python script to generate data.json
        env:
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: |
          python3 build_app_cloud.py

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git commit -m "Auto-update fantasy data.json [skip ci]" || exit 0
          git pull --rebase origin main
          git push
